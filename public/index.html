<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#1f5eff"
  >

  <title>Teams Chat.</title>

  <link
    rel="icon"
    type="image/png"
    href="/images/logo.png"
  >

  <link
    rel="stylesheet"
    href="/style.css"
  >

  <!-- =====================================================
       TEAMSPACE RESPONSIVE / SCROLLING / PROFILE STYLES
  ====================================================== -->

  <style>

    html,
    body {
      width: 100%;
      min-width: 0;
      min-height: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    /* =====================================================
       LANDING PAGE BRAND
    ====================================================== */

    .landing-brand-text {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      line-height: 1.1;
    }

    .landing-teams-chat {
      display: block;
      color: #ffffff;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: -0.5px;
    }

    .landing-connect-chat {
      display: block;
      margin-top: 4px;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    @media (max-width: 480px) {
      .landing-teams-chat { font-size: 26px; }
      .landing-connect-chat { font-size: 15px; }
    }

    /* =====================================================
       AUTHENTICATION
    ====================================================== */

    #forgotPassword {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 8px 10px;
      border: 0;
      background: transparent;
      color: #1f5eff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
    }

    #forgotPassword:hover {
      text-decoration: underline;
    }

    #authError {
      min-height: 18px;
    }

    /* =====================================================
       APPLICATION LAYOUT
    ====================================================== */

    .app {
      width: 100%;
      min-width: 0;
      min-height: 100dvh;
      height: 100dvh;
      overflow: hidden;
    }

    .sidebar {
      min-width: 0;
      min-height: 0;
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .sidebar > .sidebar-top,
    .sidebar > .sidebar-section:not(.contacts-section),
    .sidebar > #profileCard {
      flex: 0 0 auto;
    }

    .sidebar > .contacts-section {
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
    }

    .chat-area {
      min-width: 0;
      min-height: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header,
    .composer,
    #uploadStatus {
      flex: 0 0 auto;
    }

    /* =====================================================
       SIDEBAR SCROLLING
    ====================================================== */

    .contacts-section {
      min-height: 0 !important;
      display: flex !important;
      flex-direction: column !important;
      overflow: hidden !important;
    }

    #userList {
      min-width: 0;
      min-height: 0;
      flex: 1 1 auto;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      touch-action: pan-y;
      scrollbar-width: thin;
      padding-right: 2px;
    }

    /* =====================================================
       MESSAGE SCROLLING
    ====================================================== */

    #messages {
      min-width: 0;
      min-height: 0;
      flex: 1 1 auto;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      touch-action: pan-y;
      scrollbar-width: thin;
    }

    #userList::-webkit-scrollbar,
    #messages::-webkit-scrollbar {
      width: 7px;
    }

    #userList::-webkit-scrollbar-thumb,
    #messages::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.45);
      border-radius: 10px;
    }

    #userList::-webkit-scrollbar-track,
    #messages::-webkit-scrollbar-track {
      background: transparent;
    }

    /* =====================================================
       USER LIST
    ====================================================== */

    .user-item {
      position: relative;
      min-width: 0;
    }

    .user-info {
      min-width: 0;
      flex: 1;
    }

    .user-info strong,
    .user-info span,
    .user-info small {
      display: block;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* =====================================================
       WORKSPACE NAVIGATION
    ====================================================== */

    .workspace-nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .nav-item {
      width: 100%;
      min-width: 0;
    }

    /* =====================================================
       PEOPLE SEARCH
    ====================================================== */

    .people-search-wrapper {
      width: 100%;
      min-width: 0;
      margin-bottom: 10px;
      flex: 0 0 auto;
    }

    .people-search-wrapper input,
    #peopleSearchInput {
      width: 100%;
      min-width: 0;
      padding: 10px 12px;
      border: 1px solid rgba(127, 127, 127, 0.3);
      border-radius: 9px;
      background: transparent;
      color: inherit;
      outline: none;
    }

    .people-search-wrapper input:focus,
    #peopleSearchInput:focus {
      border-color: #2563eb;
    }

    /* =====================================================
       CREATE GROUP BUTTON
    ====================================================== */

    .teamspace-group-button {
      width: 100%;
      margin: 0 0 10px;
      padding: 10px 14px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      background: #1f5eff;
      color: #ffffff;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .teamspace-group-button:hover {
      opacity: 0.92;
    }

    .teamspace-group-button:active {
      transform: scale(0.98);
    }

    /* =====================================================
       PROFILE BUTTON
    ====================================================== */

    .user-profile-button {
      flex-shrink: 0;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font-size: 18px;
    }

    .user-profile-button:hover {
      background: rgba(127, 127, 127, 0.15);
    }

    /* =====================================================
       PROFILE MODALS
    ====================================================== */

    .profile-modal {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }

    .profile-modal.hidden {
      display: none !important;
    }

    .profile-modal-card {
      position: relative;
      width: min(430px, 100%);
      max-height: min(700px, 90vh);
      overflow-y: auto;
      padding: 28px;
      border-radius: 18px;
      background: var(--card-bg, #ffffff);
      color: var(--text-color, #111827);
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.25);
      scrollbar-width: thin;
    }

    .profile-modal-card::-webkit-scrollbar {
      width: 6px;
    }

    .profile-modal-card::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.45);
      border-radius: 10px;
    }

    .profile-modal-close {
      position: absolute;
      top: 12px;
      right: 14px;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: inherit;
      font-size: 28px;
      line-height: 1;
      cursor: pointer;
    }

    .profile-modal-close:hover {
      background: rgba(127, 127, 127, 0.15);
    }

    .profile-modal-avatar {
      width: 82px;
      height: 82px;
      margin: 5px auto 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: linear-gradient(135deg, #2563eb, #d4a017);
      color: #ffffff;
      font-size: 28px;
      font-weight: 700;
      overflow: hidden;
    }

    .profile-modal-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .group-avatar {
      font-size: 32px;
    }

    .profile-modal-card h2 {
      margin: 0;
      text-align: center;
      font-size: 22px;
    }

    .profile-modal-subtitle {
      margin: 7px 0 20px;
      text-align: center;
      opacity: 0.7;
    }

    /* =====================================================
       PROFILE FORM
    ====================================================== */

    .profile-field {
      margin-bottom: 16px;
    }

    .profile-field label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0.75;
    }

    .profile-field input {
      width: 100%;
      padding: 11px 13px;
      border: 1px solid rgba(127, 127, 127, 0.3);
      border-radius: 9px;
      background: transparent;
      color: inherit;
      outline: none;
    }

    .profile-field input:focus {
      border-color: #2563eb;
    }

    .profile-save-btn {
      width: 100%;
      padding: 11px 15px;
      border: 0;
      border-radius: 9px;
      background: #2563eb;
      color: #ffffff;
      font-weight: 600;
      cursor: pointer;
    }

    .profile-save-btn:hover {
      opacity: 0.9;
    }

    .profile-save-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .profile-message {
      margin-top: 10px;
      text-align: center;
      font-size: 13px;
    }

    /* =====================================================
       GROUP ADMIN CONTROLS
    ====================================================== */

    .group-admin-controls {
      margin-bottom: 12px;
      padding: 14px;
      border-radius: 12px;
      background: rgba(37, 99, 235, 0.08);
    }

    .group-admin-controls label {
      display: block;
      margin-bottom: 7px;
      font-size: 12px;
      font-weight: 600;
    }

    .group-admin-controls input {
      width: 100%;
      padding: 10px;
      border: 1px solid rgba(127, 127, 127, 0.3);
      border-radius: 8px;
      background: transparent;
      color: inherit;
      outline: none;
    }

    .group-admin-controls input:focus {
      border-color: #2563eb;
    }

    .group-admin-save {
      width: 100%;
      margin-top: 8px;
      padding: 9px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: #ffffff;
      cursor: pointer;
      font-weight: 600;
    }

    .group-admin-save:hover {
      opacity: 0.9;
    }

    .group-admin-save:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* =====================================================
       GROUP MEMBERS
    ====================================================== */

    .group-members-heading {
      margin: 20px 0 10px;
      font-size: 14px;
      font-weight: 700;
    }

    .group-members-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
      max-height: 300px;
      overflow-y: auto;
      scrollbar-width: thin;
    }

    .group-members-list::-webkit-scrollbar {
      width: 6px;
    }

    .group-members-list::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.45);
      border-radius: 10px;
    }

    .group-member {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border-radius: 10px;
      background: rgba(127, 127, 127, 0.08);
      min-width: 0;
    }

    .group-member-avatar {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #2563eb;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      overflow: hidden;
    }

    .group-member-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .group-member-info {
      min-width: 0;
      flex: 1;
    }

    .group-member-name {
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .group-member-email {
      margin-top: 2px;
      font-size: 12px;
      opacity: 0.65;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .group-admin-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(212, 160, 23, 0.18);
      color: #a87900;
      font-size: 11px;
      font-weight: 700;
    }

    .group-member-remove {
      flex-shrink: 0;
      border: 0;
      padding: 7px 9px;
      border-radius: 7px;
      background: rgba(220, 38, 38, 0.1);
      color: #dc2626;
      cursor: pointer;
      font-size: 12px;
    }

    .group-member-remove:hover {
      background: rgba(220, 38, 38, 0.18);
    }

    .group-member-remove:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* =====================================================
       LEAVE GROUP
    ====================================================== */

    .group-profile-actions {
      margin-top: 20px;
    }

    .danger-profile-btn {
      width: 100%;
      padding: 11px;
      border: 0;
      border-radius: 9px;
      background: #dc2626;
      color: #ffffff;
      cursor: pointer;
      font-weight: 600;
    }

    .danger-profile-btn:hover {
      opacity: 0.9;
    }

    /* =====================================================
       PROFILE CLICK AREAS
    ====================================================== */

    .profile {
      cursor: pointer;
    }

    .chat-header-info {
      cursor: pointer;
      min-width: 0;
    }

    .group-header-clickable {
      cursor: pointer;
    }

    .group-header-clickable:hover {
      opacity: 0.85;
    }

    /* =====================================================
       AVATARS
    ====================================================== */

    #currentUserAvatar,
    #chatHeaderAvatar,
    .avatar {
      overflow: hidden;
    }

    #currentUserAvatar img,
    #chatHeaderAvatar img,
    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
    }

    /* =====================================================
       MESSAGE STATUS / RECEIPTS
    ====================================================== */

    .message-status {
      display: inline-flex;
      align-items: center;
      margin-left: 6px;
      font-size: 12px;
      line-height: 1;
      letter-spacing: -1px;
      user-select: none;
      vertical-align: middle;
    }

    .message-status.sent {
      color: #777777;
    }

    .message-status.delivered {
      color: #777777;
    }

    .message-status.read {
      color: #1f5eff;
    }

    /* =====================================================
       MESSAGE CONTENT
    ====================================================== */

    .message-text {
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .message-image {
      display: block;
      max-width: 100%;
      height: auto;
      border-radius: 10px;
    }

    /* =====================================================
       ENCRYPTION INDICATOR
    ====================================================== */

    .encryption-indicator {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
    }

    /* =====================================================
       UPLOAD STATUS
    ====================================================== */

    #uploadStatus {
      flex: 0 0 auto;
      min-width: 0;
    }

    /* =====================================================
       TABLETS
    ====================================================== */

    @media (max-width: 900px) {

      .sidebar {
        width: min(330px, 38vw);
      }

      .chat-area {
        min-width: 0;
      }

    }

    /* =====================================================
       PHONES
       
       IMPORTANT:
       The sidebar and chat area are placed one above
       another. Both have their own independent scroll
       containers.
    ====================================================== */

    @media (max-width: 640px) {

      html,
      body {
        width: 100%;
        height: 100%;
        min-height: 100%;
        overflow: hidden !important;
      }

      .app {
        width: 100%;
        height: 100dvh !important;
        min-height: 100dvh !important;
        max-height: 100dvh !important;
        display: flex !important;
        flex-direction: column !important;
        overflow: hidden !important;
      }

      /* ---------------------------------------------------
         MOBILE SIDEBAR
      --------------------------------------------------- */

      .sidebar {
        width: 100% !important;
        flex: 0 0 50% !important;
        height: 50% !important;
        min-height: 0 !important;
        max-height: 50% !important;

        border-right: none !important;
        border-bottom: 1px solid rgba(148, 163, 184, 0.25);

        display: flex !important;
        flex-direction: column !important;

        overflow: hidden !important;
      }

      /* ---------------------------------------------------
         SIDEBAR TOP
      --------------------------------------------------- */

      .sidebar-top {
        width: 100%;
        min-width: 0;
        padding: 8px 10px !important;
        flex: 0 0 auto !important;
      }

      .brand {
        min-width: 0;
      }

      .brand-icon {
        width: 30px !important;
        height: 30px !important;
        min-width: 30px !important;
        font-size: 15px !important;
      }

      .brand strong {
        font-size: 13px !important;
      }

      .brand span {
        font-size: 10px !important;
      }

      /* ---------------------------------------------------
         WORKSPACE SECTION
      --------------------------------------------------- */

      .sidebar-section {
        width: 100%;
        min-width: 0;
        padding: 6px 10px !important;
        flex: 0 0 auto !important;
      }

      .section-title {
        min-width: 0;
        font-size: 10px !important;
        margin-bottom: 4px !important;
      }

      .workspace-nav {
        width: 100%;
        min-width: 0;
        gap: 2px !important;
      }

      .nav-item {
        width: 100% !important;
        min-width: 0 !important;
        padding: 6px 10px !important;
        font-size: 12px !important;
      }

      /* ---------------------------------------------------
         CONTACTS SECTION
         
         This section takes ALL remaining space.
         Only #userList scrolls.
      --------------------------------------------------- */

      .contacts-section {
        width: 100% !important;
        min-width: 0 !important;
        min-height: 0 !important;

        flex: 1 1 auto !important;

        padding: 4px 10px !important;

        display: flex !important;
        flex-direction: column !important;

        overflow: hidden !important;
      }

      .contacts-section > .section-title {
        flex: 0 0 auto !important;
      }

      #peopleSearchWrapper {
        flex: 0 0 auto !important;
        min-height: 0 !important;
      }

      /* THE IMPORTANT PART:
         The list gets the remaining height and scrolls. */

      #userList {
        width: 100% !important;
        min-width: 0 !important;
        min-height: 0 !important;

        flex: 1 1 auto !important;

        height: auto !important;
        max-height: none !important;

        overflow-y: auto !important;
        overflow-x: hidden !important;

        -webkit-overflow-scrolling: touch !important;
        overscroll-behavior: contain !important;
        touch-action: pan-y !important;

        scrollbar-width: thin;
      }

      /* ---------------------------------------------------
         PROFILE
      --------------------------------------------------- */

      #profileCard {
        width: 100%;
        min-width: 0;
        flex: 0 0 auto !important;
        padding: 8px 10px !important;
      }

      #currentUserAvatar,
      #chatHeaderAvatar,
      .avatar {
        width: 30px !important;
        height: 30px !important;
        min-width: 30px !important;
        min-height: 30px !important;
      }

      .profile-info {
        min-width: 0;
        flex: 1;
      }

      .profile-info strong {
        font-size: 12px !important;
      }

      .profile-info span {
        font-size: 10px !important;
      }

      /* ---------------------------------------------------
         CHAT AREA
      --------------------------------------------------- */

      .chat-area {
        width: 100% !important;
        min-width: 0 !important;
        min-height: 0 !important;

        flex: 1 1 auto !important;

        height: 50% !important;

        display: flex !important;
        flex-direction: column !important;

        overflow: hidden !important;
      }

      .chat-header {
        width: 100%;
        min-width: 0;
        flex: 0 0 auto !important;
        padding: 10px 12px !important;
      }

      .chat-header-info {
        min-width: 0 !important;
        flex: 1 1 auto;
      }

      .chat-header h2 {
        font-size: 16px !important;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .chat-header p {
        font-size: 12px !important;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* ---------------------------------------------------
         MESSAGE AREA
         
         Messages have their OWN scroll.
      --------------------------------------------------- */

      #messages {
        width: 100% !important;
        min-width: 0 !important;
        min-height: 0 !important;

        flex: 1 1 auto !important;

        height: auto !important;
        max-height: none !important;

        padding: 10px !important;

        overflow-y: auto !important;
        overflow-x: hidden !important;

        -webkit-overflow-scrolling: touch !important;
        overscroll-behavior: contain !important;
        touch-action: pan-y !important;
      }

      .messages {
        min-width: 0;
      }

      .message {
        max-width: 88%;
      }

      /* ---------------------------------------------------
         COMPOSER
      --------------------------------------------------- */

      .composer {
        width: 100%;
        min-width: 0;

        flex: 0 0 auto !important;

        padding: 8px !important;
      }

      #messageInput {
        min-width: 0 !important;
        width: 100%;
        font-size: 16px !important;
      }

      #sendMessageBtn,
      #imageButton {
        flex-shrink: 0;
      }

      /* ---------------------------------------------------
         UPLOAD STATUS
      --------------------------------------------------- */

      #uploadStatus {
        width: 100%;
        min-width: 0;
        max-width: 100%;
        flex: 0 0 auto !important;
        overflow: hidden;
      }

      /* ---------------------------------------------------
         MODALS
      --------------------------------------------------- */

      .profile-modal {
        padding: 12px;
      }

      .profile-modal-card {
        width: min(430px, 100%);
        max-width: 100%;
        max-height: 92dvh;
        padding: 24px 18px;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
      }

    }

    /* =====================================================
       SMALL PHONES
    ====================================================== */

    @media (max-width: 480px) {

      .sidebar {
        flex: 0 0 52% !important;
        height: 52% !important;
        max-height: 52% !important;
      }

      .chat-area {
        flex: 1 1 auto !important;
        height: 48% !important;
        min-height: 0 !important;
      }

      .user-item {
        padding: 8px !important;
      }

      .message {
        max-width: 86% !important;
      }

      .profile-modal-avatar {
        width: 72px;
        height: 72px;
      }

      .group-members-list {
        max-height: 260px;
      }

      .group-member {
        padding: 8px;
      }

      .group-member-remove {
        padding: 6px 7px;
        font-size: 11px;
      }

    }

    /* =====================================================
       VERY SMALL SCREENS
    ====================================================== */

    @media (max-width: 360px) {

      .sidebar {
        flex: 0 0 54% !important;
        height: 54% !important;
        max-height: 54% !important;
      }

      .chat-area {
        height: 46% !important;
      }

      .sidebar-top {
        padding: 6px 8px !important;
      }

      .sidebar-section {
        padding-left: 8px !important;
        padding-right: 8px !important;
      }

      .contacts-section {
        padding-left: 8px !important;
        padding-right: 8px !important;
      }

      .nav-item {
        padding: 5px 8px !important;
      }

      #profileCard {
        padding-left: 8px !important;
        padding-right: 8px !important;
      }

      .profile-modal-card {
        padding: 20px 14px;
      }

      .group-admin-controls {
        padding: 11px;
      }

    }

    /* =====================================================
       LANDSCAPE PHONES
       
       Gives both sections enough usable height when the
       phone is rotated horizontally.
    ====================================================== */

    @media (max-width: 900px) and (orientation: landscape) {

      .sidebar {
        flex: 0 0 45% !important;
        height: 45% !important;
        max-height: 45% !important;
      }

      .chat-area {
        height: 55% !important;
      }

      .sidebar-top {
        padding-top: 5px !important;
        padding-bottom: 5px !important;
      }

      .sidebar-section {
        padding-top: 4px !important;
        padding-bottom: 4px !important;
      }

      #profileCard {
        padding-top: 5px !important;
        padding-bottom: 5px !important;
      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       AUTHENTICATION SCREEN
  ====================================================== -->

  <section
    id="authScreen"
    class="auth-screen"
  >

    <div class="auth-card">


      <!-- BRAND -->

      <div class="brand brand-large">

        <div class="brand-icon">
          T
        </div>

        <div class="landing-brand-text">

          <strong class="landing-teams-chat">
            Teams Chat
          </strong>

          <span class="landing-connect-chat">
            Connect Chat
          </span>

        </div>

      </div>


      <!-- =================================================
           AUTH TABS
      ================================================== -->

      <div class="auth-tabs">

        <button
          id="loginTab"
          class="tab active"
          data-mode="login"
          type="button"
        >
          Sign in
        </button>

        <button
          id="registerTab"
          class="tab"
          data-mode="register"
          type="button"
        >
          Create account
        </button>

      </div>


      <!-- =================================================
           AUTH FORM
      ================================================== -->

      <form
        id="authForm"
        novalidate
      >


        <!-- NAME -->

        <div
          id="nameGroup"
          class="form-group hidden"
        >

          <label for="authName">
            Full name
          </label>

          <input
            id="authName"
            type="text"
            placeholder="e.g. Username"
            autocomplete="name"
          >

        </div>


        <!-- EMAIL -->

        <div class="form-group">

          <label for="authEmail">
            Email
          </label>

          <input
            id="authEmail"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

          <label for="authPassword">
            Password
          </label>

          <input
            id="authPassword"
            type="password"
            placeholder="At least 6 characters"
            autocomplete="current-password"
            required
          >

        </div>


        <!-- AUTH SUBMIT -->

        <button
          id="authSubmit"
          class="primary-btn"
          type="submit"
        >
          Sign in
        </button>


        <!-- FORGOT PASSWORD -->

        <button
          id="forgotPassword"
          type="button"
        >
          Forgot password?
        </button>


        <!-- AUTH ERROR -->

        <p
          id="authError"
          class="error"
          aria-live="polite"
        ></p>

      </form>

    </div>

  </section>


  <!-- =====================================================
       MAIN APPLICATION
  ====================================================== -->

  <div
    id="appScreen"
    class="app hidden"
  >


    <!-- =================================================
         SIDEBAR
    ================================================== -->

    <aside class="sidebar">


      <!-- =================================================
           SIDEBAR TOP
      ================================================== -->

      <div class="sidebar-top">

        <div class="brand">

          <div class="brand-icon">
            T
          </div>

          <div>

            <strong>
              Teams Chat
            </strong>

            <span>
              Messaging
            </span>

          </div>

        </div>


        <!-- DARK MODE -->

        <button
          id="themeToggle"
          class="theme-toggle"
          type="button"
          title="Toggle dark mode"
          aria-label="Toggle dark mode"
        >
          🌙
        </button>

      </div>


      <!-- =================================================
           WORKSPACE NAVIGATION
      ================================================== -->

      <div class="sidebar-section">

        <div class="section-title">
          Workspace
        </div>

        <div
          id="workspaceNav"
          class="workspace-nav"
        >


          <!-- CHAT -->

          <button
            id="chatNav"
            class="nav-item active"
            type="button"
          >

            <span>
              💬
            </span>

            Chat

          </button>


          <!-- PEOPLE -->

          <button
            id="peopleNav"
            class="nav-item"
            type="button"
          >

            <span>
              👥
            </span>

            People

          </button>


          <!-- GROUPS -->

          <button
            id="groupsNav"
            class="nav-item"
            type="button"
          >

            <span>
              👥
            </span>

            Groups

          </button>

        </div>

      </div>


      <!-- =================================================
           CHAT / PEOPLE / GROUPS
      ================================================== -->

      <div
        class="sidebar-section contacts-section"
      >


        <!-- LIST HEADER -->

        <div class="section-title">

          <span id="listTitle">
            Chats
          </span>

          <button
            id="refreshUsers"
            type="button"
            title="Refresh"
            aria-label="Refresh"
          >
            ↻
          </button>

        </div>


        <!-- PEOPLE SEARCH -->

        <div
          id="peopleSearchWrapper"
          class="people-search-wrapper hidden"
        >

          <input
            id="peopleSearchInput"
            type="search"
            placeholder="Search people..."
            autocomplete="off"
            aria-label="Search people"
          >

        </div>


        <!--
          JavaScript reuses this container for:

          Chat   = existing conversations
          People = all registered users
          Groups = groups belonging to current user
        -->

        <div id="userList"></div>

      </div>


      <!-- =================================================
           CURRENT USER PROFILE
      ================================================== -->

      <div
        id="profileCard"
        class="profile"
        title="Open your profile"
      >


        <!-- AVATAR -->

        <div
          id="currentUserAvatar"
          class="avatar"
        ></div>


        <!-- USER DETAILS -->

        <div class="profile-info">

          <strong id="currentUserName"></strong>

          <span id="currentUserEmail"></span>

        </div>


        <!-- ACCOUNT ACTIONS -->

        <div class="account-actions">


          <!-- LOGOUT -->

          <button
            id="logoutButton"
            class="account-btn logout-btn"
            type="button"
            title="Log out"
            aria-label="Log out"
          >
            ↪
          </button>


          <!-- DELETE ACCOUNT -->

          <button
            id="deleteAccountButton"
            class="account-btn delete-account-btn"
            type="button"
            title="Delete account"
            aria-label="Delete account"
          >
            🗑
          </button>

        </div>

      </div>

    </aside>


    <!-- =================================================
         CHAT AREA
    ================================================== -->

    <main class="chat-area">


      <!-- =================================================
           CHAT HEADER
      ================================================== -->

      <header class="chat-header">


        <!-- CURRENT CHAT AVATAR -->

        <div
          id="chatHeaderAvatar"
          class="avatar"
        ></div>


        <!--
          Clicking this area opens the selected
          person's profile or selected group details.
        -->

        <div
          id="chatHeaderInfo"
          class="chat-header-info"
          title="Open profile"
        >

          <h2 id="chatHeaderName">
            Select a contact
          </h2>

          <p id="chatHeaderStatus">
            Choose someone from People to start chatting.
          </p>

        </div>

      </header>


      <!-- =================================================
           MESSAGES
      ================================================== -->

      <section
        id="messages"
        class="messages"
      >

        <div class="empty-chat">

          <div class="empty-icon">
            💬
          </div>

          <h2>
            Your conversations
          </h2>

          <p>
            Select a person from People to start a private chat,
            or open Chat to continue an existing conversation.
          </p>

        </div>

      </section>


      <!-- =================================================
           MESSAGE COMPOSER
      ================================================== -->

      <form
        id="messageForm"
        class="composer hidden"
      >


        <!-- PHOTO BUTTON -->

        <button
          id="imageButton"
          class="image-button"
          type="button"
          title="Share a photo"
          aria-label="Share a photo"
        >
          📷
        </button>


        <!-- PHOTO INPUT -->

        <input
          id="imageInput"
          type="file"
          accept="image/*"
          hidden
        >


        <!-- MESSAGE INPUT -->

        <input
          id="messageInput"
          type="text"
          autocomplete="off"
          maxlength="5000"
          placeholder="Type a message..."
        >


        <!-- SEND BUTTON -->

        <button
          id="sendMessageBtn"
          type="submit"
          title="Send message"
          aria-label="Send message"
        >
          ➤
        </button>

      </form>


      <!-- =================================================
           PHOTO UPLOAD STATUS
      ================================================== -->

      <div
        id="uploadStatus"
        class="upload-status"
        aria-live="polite"
      ></div>

    </main>

  </div>


  <!-- =====================================================
       USER PROFILE MODAL
  ====================================================== -->

  <div
    id="profileModal"
    class="profile-modal hidden"
    role="dialog"
    aria-modal="true"
    aria-labelledby="profileModalTitle"
  >

    <div class="profile-modal-card">


      <!-- CLOSE -->

      <button
        id="closeProfileModal"
        class="profile-modal-close"
        type="button"
        aria-label="Close profile"
      >
        ×
      </button>


      <!-- AVATAR -->

      <div
        id="profileModalAvatar"
        class="profile-modal-avatar"
      ></div>


      <!-- NAME -->

      <h2 id="profileModalTitle">
        Profile
      </h2>


      <!-- EMAIL / DESCRIPTION -->

      <p
        id="profileModalSubtitle"
        class="profile-modal-subtitle"
      ></p>


      <!-- PROFILE CONTENT -->

      <div id="profileModalContent"></div>

    </div>

  </div>


  <!-- =====================================================
       GROUP PROFILE MODAL
  ====================================================== -->

  <div
    id="groupProfileModal"
    class="profile-modal hidden"
    role="dialog"
    aria-modal="true"
    aria-labelledby="groupProfileName"
  >

    <div
      class="profile-modal-card group-profile-card"
    >


      <!-- CLOSE -->

      <button
        id="closeGroupProfileModal"
        class="profile-modal-close"
        type="button"
        aria-label="Close group profile"
      >
        ×
      </button>


      <!-- GROUP AVATAR -->

      <div
        id="groupProfileAvatar"
        class="profile-modal-avatar group-avatar"
      >
        👥
      </div>


      <!-- GROUP NAME -->

      <h2 id="groupProfileName">
        Group
      </h2>


      <!-- GROUP MEMBER COUNT -->

      <p
        id="groupProfileSubtitle"
        class="profile-modal-subtitle"
      ></p>


      <!-- =================================================
           GROUP ADMIN CONTROLS
      ================================================== -->

      <div id="groupAdminControls"></div>


      <!-- MEMBERS TITLE -->

      <div class="group-members-heading">
        Members
      </div>


      <!-- MEMBERS -->

      <div
        id="groupMembersList"
        class="group-members-list"
      ></div>


      <!-- =================================================
           GROUP ACTIONS
      ================================================== -->

      <div class="group-profile-actions">

        <button
          id="leaveGroupBtn"
          class="danger-profile-btn"
          type="button"
        >
          Leave Group
        </button>

      </div>

    </div>

  </div>


  <!-- =====================================================
       FIREBASE SDK
  ====================================================== -->

  <script
    src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"
  ></script>

  <script
    src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"
  ></script>

  <script
    src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"
  ></script>


  <!-- =====================================================
       TEAMSPACE APPLICATION
  ====================================================== -->

  <script src="/app.js"></script>

</body>

</html>
